; Export presets for the engine, used by CI (.github/workflows/release.yml) and
; `make engine-export`. Paths are relative to this folder; the builds go to
; build/<platform>/ at the repository root. Options left out take Godot's defaults.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter=""
export_path="../../build/linux/DarkSunEngine.x86_64"
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter=""
export_path="../../build/windows/DarkSunEngine.exe"
script_export_mode=2

[preset.1.options]

binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
; rcedit (icons and version info) isn't on the CI runners.
application/modify_resources=false
codesign/enable=false

[preset.2]

name="macOS"
platform="macOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter=""
export_path="../../build/macos/DarkSunEngine.zip"
script_export_mode=2

[preset.2.options]

export/distribution_type=1
binary_format/architecture="universal"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
application/bundle_identifier="io.github.calvinrodo.darksunengine"
application/short_version="0.1.0"
application/version="0.1.0"
; Unsigned: no Apple certificate in CI (players right-click > Open the first time).
codesign/codesign=1
notarization/notarization=0
