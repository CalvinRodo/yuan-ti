name: Set up Godot .NET
description: >
  Download the Godot .NET editor and its export templates (cached between runs),
  install the templates where Godot looks for them, and put the editor's path in
  the GODOT environment variable.

inputs:
  version:
    description: Godot version, as in its release tag without "-stable" (e.g. 4.7.2).
    required: true

runs:
  using: composite
  steps:
    - name: Cache Godot
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/godot
          ~/.local/share/godot/export_templates/${{ inputs.version }}.stable.mono
        key: godot-mono-${{ inputs.version }}

    - name: Download Godot and export templates
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        base="https://github.com/godotengine/godot/releases/download/${{ inputs.version }}-stable"
        mkdir -p ~/godot
        curl -fsSL -o /tmp/godot.zip "$base/Godot_v${{ inputs.version }}-stable_mono_linux_x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot
        curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${{ inputs.version }}-stable_mono_export_templates.tpz"
        unzip -q /tmp/templates.tpz -d /tmp/templates
        templates=~/.local/share/godot/export_templates/${{ inputs.version }}.stable.mono
        mkdir -p "$templates"
        mv /tmp/templates/templates/* "$templates/"
        rm -rf /tmp/godot.zip /tmp/templates.tpz /tmp/templates

    - name: Put Godot on the path
      shell: bash
      run: |
        echo "GODOT=$HOME/godot/Godot_v${{ inputs.version }}-stable_mono_linux_x86_64/Godot_v${{ inputs.version }}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
