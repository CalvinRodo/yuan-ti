<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GFF Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">

    <header id="header">
      <div id="header-brand">
        <span class="header-icon">&#9728;</span>
        <h1>GFF Viewer</h1>
      </div>
      <div id="header-controls">
        <label class="control-label" for="game-select">Game</label>
        <select id="game-select">
          <option value="dark_sun">Dark Sun: Shattered Lands</option>
        </select>
      </div>
    </header>

    <div id="layout">

      <!-- ===== MODE NAV ===== -->
      <nav id="mode-nav">
        <button class="mode-btn active" data-mode="spells" title="Spell Viewer">
          <span class="mode-icon">&#10022;</span>
          <span class="mode-label">Spells</span>
        </button>
        <button class="mode-btn" data-mode="map" title="Map Viewer">
          <span class="mode-icon">&#8862;</span>
          <span class="mode-label">Map</span>
        </button>
        <button class="mode-btn" data-mode="regions" title="Region Node Map">
          <span class="mode-icon">&#9678;</span>
          <span class="mode-label">Regions</span>
        </button>
        <button class="mode-btn" data-mode="resources" title="Resource Viewer">
          <span class="mode-icon">&#8801;</span>
          <span class="mode-label">Resources</span>
        </button>
        <button class="mode-btn" data-mode="images" title="Image Viewer">
          <span class="mode-icon">&#9707;</span>
          <span class="mode-label">Images</span>
        </button>
        <button class="mode-btn" data-mode="text" title="Text Viewer">
          <span class="mode-icon">&#9776;</span>
          <span class="mode-label">Text</span>
        </button>
        <button class="mode-btn" data-mode="palette" title="Palette Viewer">
          <span class="mode-icon">&#9632;</span>
          <span class="mode-label">Palettes</span>
        </button>
        <button class="mode-btn" data-mode="music" title="Music Player">
          <span class="mode-icon">&#9835;</span>
          <span class="mode-label">Music</span>
        </button>
        <button class="mode-btn" data-mode="sfx" title="Sound Effects">
          <span class="mode-icon">&#128266;</span>
          <span class="mode-label">SFX</span>
        </button>
        <button class="mode-btn" data-mode="cinematic" title="Cinematic Viewer">
          <span class="mode-icon">&#127909;</span>
          <span class="mode-label">Cinema</span>
        </button>
        <button class="mode-btn" data-mode="data" title="Game Data Browser">
          <span class="mode-icon">&#128218;</span>
          <span class="mode-label">Data</span>
        </button>
        <button class="mode-btn" data-mode="scripts" title="GPL Script Browser">
          <span class="mode-icon">&#128196;</span>
          <span class="mode-label">Scripts</span>
        </button>
        <button class="mode-btn" data-mode="sprite" title="Sprite Viewer">
          <span class="mode-icon">&#9812;</span>
          <span class="mode-label">Sprites</span>
        </button>
        <button class="mode-btn" data-mode="prefs" title="Preferences">
          <span class="mode-icon">&#9881;</span>
          <span class="mode-label">Prefs</span>
        </button>
      </nav>

      <!-- ===== MAIN ===== -->
      <main id="main">

        <!-- Mode toolbar -->
        <div id="mode-toolbar">
          <div id="mode-gff-group" class="tb-group hidden">
            <label class="control-label" for="mode-gff-select">File</label>
            <select id="mode-gff-select"></select>
          </div>

          <div id="img-view-group" class="tb-group hidden">
            <label class="control-label">View</label>
            <div class="btn-pair">
              <button id="img-card-btn"    class="view-toggle active" title="Card view">&#8862; Cards</button>
              <button id="img-list-btn"    class="view-toggle"        title="List view">&#9776; List</button>
              <button id="img-sprites-btn" class="view-toggle"        title="Sprite sheets only">&#9673; Sprites</button>
            </div>
            <span class="tb-divider"></span>
            <label class="control-label">Size</label>
            <div class="btn-pair">
              <button id="img-zoom-out" class="view-toggle" title="Smaller cards">&#8722;</button>
              <span   id="img-zoom-label" class="img-zoom-label">M</span>
              <button id="img-zoom-in"  class="view-toggle" title="Larger cards">+</button>
            </div>
          </div>

          <div id="pal-group" class="tb-group">
            <label class="control-label" for="pal-select">Palette</label>
            <select id="pal-select">
              <option value="auto">Auto&#8209;detect</option>
            </select>
          </div>
        </div>

        <!-- Resource filter bar (resources mode only) -->
        <div id="res-filter-bar" class="hidden">
          <select id="res-filter-tag" class="res-filter-input res-filter-select">
            <option value="">All types</option>
          </select>
          <span id="res-filter-count" class="res-filter-count"></span>
        </div>

        <!-- Image type filter bar (images mode only) -->
        <div id="img-filter-bar" class="hidden"></div>

        <!-- Split: content + detail pane -->
        <div id="split">

          <!-- Content -->
          <div id="content">
            <div id="empty-state">
              <div class="empty-icon">&#9728;</div>
              <p id="empty-msg">Select a mode to begin.</p>
            </div>

            <div id="image-grid"      class="hidden"></div>

            <div id="image-list-wrap" class="hidden">
              <table id="image-list-table">
                <thead>
                  <tr>
                    <th></th>
                    <th>Tag</th>
                    <th>Number</th>
                    <th>Size</th>
                  </tr>
                </thead>
                <tbody id="image-list-tbody"></tbody>
              </table>
            </div>

            <div id="img-sprite-view" class="hidden"></div>

            <div id="spell-grid"      class="hidden"></div>

            <!-- Text viewer -->
            <div id="text-view" class="hidden">
              <div id="text-list-wrap">
                <div id="text-list-filter">
                  <input id="text-search" type="search" placeholder="Search&#8230;" autocomplete="off" spellcheck="false">
                  <span id="text-search-count"></span>
                </div>
                <ul id="text-list"></ul>
              </div>
              <div id="text-reader">
                <div id="text-reader-empty">Select an entry to read it.</div>
                <div id="text-reader-content" class="hidden">
                  <div id="text-reader-header">
                    <span id="text-reader-badge"></span>
                    <span id="text-reader-num" class="dim"></span>
                  </div>
                  <div id="text-reader-body"></div>
                </div>
              </div>
            </div>

            <!-- Region tile-map viewer -->
            <div id="region-nodes-view" class="hidden"></div>
            <div id="rmap-view" class="hidden">
              <div id="map-toolbar">
                <select id="rmap-select" class="hidden"></select>
                <input  id="map-width-input" class="hidden" type="number" min="1" max="2048">
                <span   id="map-size-label"  class="hidden"></span>
                <div class="map-ctrl-group">
                  <label class="control-label">Zoom</label>
                  <button id="map-zoom-out" class="map-btn" title="Zoom out">&#8722;</button>
                  <span id="map-zoom-label" class="map-zoom-label">16px</span>
                  <button id="map-zoom-in"  class="map-btn" title="Zoom in">+</button>
                </div>
                <div class="map-ctrl-group">
                  <button id="map-reset-pan" class="map-btn map-btn-text" title="Reset pan">&#8962; Reset</button>
                </div>
                <div class="map-ctrl-group">
                  <label for="map-environment" class="control-label">Environment</label>
                  <select id="map-environment" disabled>
                    <option value="outdoors">Outdoors</option>
                    <option value="indoors">Indoors</option>
                  </select>
                  <span id="map-environment-status" class="dim" role="status" aria-live="polite"></span>
                </div>
              </div>
              <div id="map-canvas-wrap">
                <img id="map-render-img" alt="Region map">
                <div id="map-spinner" class="hidden">
                  <div class="spinner"></div>
                  <span>Loading map&#8230;</span>
                </div>
              </div>
            </div>

            <!-- Palette viewer -->
            <div id="palette-view" class="hidden"></div>

            <!-- Music player -->
            <div id="music-view" class="hidden"></div>

            <!-- Sound effects player -->
            <div id="sfx-view" class="hidden"></div>

            <!-- Cinematic viewer -->
            <div id="cinematic-view" class="hidden"></div>

            <!-- Game data browser (items / monsters / spells) -->
            <div id="data-view" class="hidden"></div>

            <!-- GPL / MAS script browser -->
            <div id="scripts-view" class="hidden"></div>

            <!-- NPC / Monster sprite viewer -->
            <div id="sprite-view" class="hidden"></div>

            <!-- Preferences -->
            <div id="prefs-view" class="hidden"></div>

            <!-- All-resources table -->
            <div id="resource-table-wrap" class="hidden">
              <table id="resource-table">
                <thead>
                  <tr>
                    <th data-col="tag">Tag</th>
                    <th data-col="number">Number</th>
                    <th data-col="size">Size</th>
                    <th data-col="description">Description</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="resource-tbody"></tbody>
              </table>
            </div>

          </div><!-- /#content -->

          <!-- ===== DETAIL PANE ===== -->
          <aside id="detail-pane" class="hidden">
            <div id="detail-resizer">
              <button id="detail-toggle" aria-label="Collapse panel" title="Collapse panel">&#8249;</button>
            </div>
            <div id="detail-inner">
              <div id="detail-header">
                <div id="detail-title-wrap">
                  <span id="detail-tag"></span>
                  <span id="detail-num" class="dim"></span>
                </div>
                <div id="detail-header-right">
                  <span id="detail-size" class="dim"></span>
                  <button id="detail-close" aria-label="Close">&#10005;</button>
                </div>
              </div>
              <div id="detail-desc" class="dim"></div>

              <!-- Image view -->
              <div id="detail-image-view" class="hidden">
                <div id="detail-img-toolbar">
                  <button id="detail-prev" class="frame-nav" aria-label="Previous frame">&#8249;</button>
                  <span id="detail-frame-info"></span>
                  <button id="detail-next" class="frame-nav" aria-label="Next frame">&#8250;</button>
                  <label class="detail-scale-label" title="Pixel scale (nearest-neighbour)">
                    <select id="detail-scale">
                      <option value="1">1&times;</option>
                      <option value="2">2&times;</option>
                      <option value="3">3&times;</option>
                      <option value="4">4&times;</option>
                      <option value="6">6&times;</option>
                      <option value="8">8&times;</option>
                    </select>
                  </label>
                </div>

                <!-- Animation controls (shown when ≥ 2 frames) -->
                <div id="anim-controls" class="hidden">
                  <div id="anim-toolbar">
                    <button id="anim-play" class="anim-btn" title="Play animation">&#9654; Play</button>
                    <button id="anim-stop" class="anim-btn anim-stop-btn hidden" title="Stop animation">&#9646;&#9646; Stop</button>
                    <label class="anim-duration-wrap" title="Milliseconds displayed per frame">
                      <input id="anim-duration" type="number" min="50" max="10000" value="1000" step="50">
                      <span>ms&nbsp;/&nbsp;frame</span>
                    </label>
                    <span id="anim-status" class="anim-status"></span>
                  </div>
                  <!-- Frame range selector (shown when > 3 frames, e.g. character sheets) -->
                  <div id="anim-range" class="hidden">
                    <span class="anim-range-title">Range</span>
                    <label class="anim-range-wrap">
                      <span>From</span>
                      <input id="anim-range-start" type="number" min="1" value="1">
                    </label>
                    <label class="anim-range-wrap">
                      <span>To</span>
                      <input id="anim-range-end" type="number" min="1" value="1">
                    </label>
                  </div>
                </div>

                <div id="detail-img-wrap">
                  <canvas id="detail-img"></canvas>
                  <div id="detail-img-spinner" class="spinner"></div>
                </div>
                <div id="detail-img-dims" class="dim"></div>
              </div>

              <!-- Hex view -->
              <div id="detail-hex-view" class="hidden">
                <div id="hex-toolbar">
                  <span id="hex-info" class="dim"></span>
                  <span id="hex-truncated" class="warn hidden">Showing first 8 KB</span>
                </div>
                <div id="hex-body">
                  <pre id="hex-pre"></pre>
                </div>
              </div>

            </div><!-- /#detail-inner -->
          </aside>

        </div><!-- /#split -->

      </main>
    </div><!-- /#layout -->
  </div><!-- /#app -->

  <script src="app.js"></script>
  <script src="view-images.js"></script>
  <script src="view-map.js"></script>
  <script src="view-regions.js"></script>
  <script src="view-spells.js"></script>
  <script src="view-text.js"></script>
  <script src="view-palette.js"></script>
  <script src="view-music.js"></script>
  <script src="view-cinematic.js"></script>
  <script src="view-data.js"></script>
  <script src="view-scripts.js"></script>
  <script src="view-sprites.js"></script>
  <script src="view-prefs.js"></script>
</body>
</html>
